[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-agent"
version = "0.1.0"
description = "Fully-local AI desktop agent for Linux (Arch Linux + Hyprland)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llama-cpp-python>=0.3.5",
    "psutil>=5.9",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "httpx>=0.27",
    "yt-dlp>=2024.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
assist = "assistant.cli:main"

[tool.setuptools.packages.find]
include = ["assistant*"]
